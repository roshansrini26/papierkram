[project]
name = "papierkram"
version = "0.1.0"
description = "A local-first assistant that explains German official letters and drafts replies, with cited sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",     # needed by FastAPI's TestClient
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papierkram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
